name: Update FPL season data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch current FPL season JSON
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://fantasy.premierleague.com/api/bootstrap-static/"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as response:
              payload = json.load(response)

          out = Path("fpl_data/2026-27")
          out.mkdir(parents=True, exist_ok=True)
          (out / "season.json").write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          print("Updated season.json")
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fpl_data/2026-27/season.json
          git diff --cached --quiet || git commit -m "chore: update FPL season data"
          git push
